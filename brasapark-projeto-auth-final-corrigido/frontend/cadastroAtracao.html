<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Atracao</title>
  <link rel="stylesheet" href="./css/style2.css">
</head>
<body>
  <div class="background-overlay">
    <main class="container">
      <section class="info-side">
        <img src="./logo.png" class="brand-logo" alt="Brasa Park">
        <h1>Criar Nova Atracao</h1>
        <div id="user-area" class="user-area"></div>
      </section>

      <section class="form-side">
        <div class="glass-card">
          <h2>Cadastro de Atracao</h2>
          <p id="message" class="message"></p>

          <form id="form-atracao">
            <input id="nome" placeholder="Nome" required>
            <input id="descricao" placeholder="Descricao">
            <input id="tipo" placeholder="Tipo" required>
            <input id="alturaMin" type="number" placeholder="Altura minima" required>
            <input id="capacidade" type="number" placeholder="Capacidade" required>

            <select id="status" required>
              <option value="Ativa">Ativa</option>
              <option value="Manutencao">Manutencao</option>
              <option value="Inativa">Inativa</option>
            </select>

            <button type="submit" class="btn-main">Cadastrar</button>
            <a class="form-link" href="/">Voltar para o inicio</a>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/cadastroAtracao.js"></script>
</body>
</html>
