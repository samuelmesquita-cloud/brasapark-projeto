<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil - Brasa Park</title>
  <link rel="stylesheet" href="./css/style2.css">
</head>
<body>
  <div class="background-overlay">
    <main class="container">
      <section class="info-side">
        <img src="./logo.png" class="brand-logo" alt="Brasa Park">
        <h1>Meu Perfil</h1>
        <div id="user-area" class="user-area"></div>
      </section>

      <section class="form-side">
        <div class="glass-card">
          <h2>Imagem do perfil</h2>
          <p id="message" class="message" role="status"></p>

          <div class="avatar-preview-wrap">
            <img id="avatar-preview" class="avatar-preview" alt="Pre-visualizacao do avatar">
            <span id="avatar-placeholder">Sem imagem</span>
          </div>

          <form id="form-image">
            <label class="file-label" for="image">Escolha uma imagem JPEG, PNG ou GIF de ate 2 MB</label>
            <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/gif" required>
            <button type="submit" class="btn-main">Enviar imagem</button>
            <a class="form-link" href="/">Voltar para o inicio</a>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/profile.js"></script>
</body>
</html>
